<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureThingStore - Premium Secure E-commerce</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald 500
                        secondary: '#0f172a', // Slate 900
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- GLOBAL STATE & CONFIG ---
        window.state = {
            user: null,
            role: 'guest', // guest, customer, admin, seller, service
            view: 'home',
            cart: [],
            products: [],
            filteredProducts: [], // For search
            orders: [],
            chats: [],
            sellerRequests: [],
            serviceMembers: [],
            activeChat: null,
            editingProduct: null, // For edit mode
            searchQuery: '',
            loading: false,
            modal: null // { type: 'otp'|'confirm'|'alert', message, onConfirm }
        };

        const firebaseConfig = {
            apiKey: "AIzaSyAEDJkwaThWJNm8lQbOLxb-JSTQ45dbHOw",
            authDomain: "thing-672ba.firebaseapp.com",
            projectId: "thing-672ba",
            storageBucket: "thing-672ba.firebasestorage.app",
            messagingSenderId: "790564641174",
            appId: "1:790564641174:web:8524eac8fd19a7efffe5b7",
            measurementId: "G-JG0PV4KYPN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'secure-thing-store-v2'; // Updated version namespace

        // --- FIRESTORE HELPERS ---
        const getPublicColl = (colName) => collection(db, 'artifacts', APP_ID, 'public', 'data', colName);
        const getPublicDoc = (colName, docId) => doc(db, 'artifacts', APP_ID, 'public', 'data', colName, docId);

        // --- UI HELPERS ---
        const showToast = (message, type = 'info') => {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-4 rounded-xl text-white shadow-2xl z-50 transform transition-all duration-300 translate-y-20 opacity-0 flex items-center gap-3 ${type === 'error' ? 'bg-red-600' : 'bg-secondary'}`;
            toast.innerHTML = `<i class="${type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle'}"></i> <span>${message}</span>`;
            document.body.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-20', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        const setLoading = (isLoading) => {
            window.state.loading = isLoading;
            const loader = document.getElementById('global-loader');
            if (loader) loader.style.display = isLoading ? 'flex' : 'none';
        };

        const openModal = (config) => {
            window.state.modal = config;
            renderApp();
        };

        const closeModal = () => {
            window.state.modal = null;
            renderApp();
        };

        // --- AUTH & ROLES ---
        const createSecondaryUser = async (email, password) => {
            const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
            const secondaryAuth = getAuth(secondaryApp);
            try {
                const userCredential = await createUserWithEmailAndPassword(secondaryAuth, email, password);
                await signOut(secondaryAuth);
                deleteApp(secondaryApp);
                return userCredential.user.uid;
            } catch (error) {
                deleteApp(secondaryApp);
                throw error;
            }
        };

        const determineRole = async (user) => {
            if (!user || user.isAnonymous) return 'guest';
            if (user.email === 'joykumbhakar101@gmail.com') return 'admin';
            try {
                const roleDoc = await getDoc(getPublicDoc('user_roles', user.uid));
                if (roleDoc.exists()) return roleDoc.data().role;
            } catch (e) { console.error("Role Error", e); }
            return 'customer';
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.state.user = user;
                window.state.role = await determineRole(user);
                
                if (window.state.role === 'customer') loadCustomerData();
                if (window.state.role === 'admin') loadAdminData();
                if (window.state.role === 'seller') loadSellerData();
                if (window.state.role === 'service') loadServiceData();
            } else {
                signInAnonymously(auth).catch(console.error);
                window.state.user = null;
                window.state.role = 'guest';
            }
            renderApp();
        });

        // --- DATA LISTENERS ---
        onSnapshot(getPublicColl('products'), (snapshot) => {
            window.state.products = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
            filterProducts(); // Update search results
            renderApp();
        });

        const loadAdminData = () => {
            ['seller_requests', 'orders', 'support_chats', 'service_members'].forEach(col => {
                onSnapshot(getPublicColl(col), (snap) => {
                    const key = col === 'support_chats' ? 'chats' : (col === 'service_members' ? 'serviceMembers' : (col === 'seller_requests' ? 'sellerRequests' : 'orders'));
                    window.state[key] = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    renderApp();
                });
            });
        };

        const loadSellerData = () => { /* Only public products needed, already global */ };
        
        const loadServiceData = () => {
            ['support_chats', 'orders'].forEach(col => {
                onSnapshot(getPublicColl(col), (snap) => {
                    window.state[col === 'support_chats' ? 'chats' : 'orders'] = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    renderApp();
                });
            });
        };

        const loadCustomerData = () => {
             onSnapshot(getPublicColl('orders'), (snap) => {
                if(window.state.user) {
                    window.state.orders = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(o => o.customerId === window.state.user.uid);
                    renderApp();
                }
            });
        };

        const filterProducts = () => {
            const q = window.state.searchQuery.toLowerCase();
            window.state.filteredProducts = window.state.products.filter(p => 
                p.name.toLowerCase().includes(q) || p.description?.toLowerCase().includes(q)
            );
        };

        // --- ACTIONS ---
        window.actions = {
            handleSearch: (val) => {
                window.state.searchQuery = val;
                filterProducts();
                if(window.state.view !== 'home') window.state.view = 'home';
                renderApp();
            },
            
            requestLogin: (email, password) => {
                openModal({
                    type: 'otp',
                    title: 'Security Verification',
                    message: `Enter the OTP sent to ${email || 'your email'}`,
                    onConfirm: (otp) => {
                        if (otp === "123456") window.actions.finalizeLogin(email, password);
                        else showToast('Invalid OTP', 'error');
                    }
                });
            },

            requestSignup: (email, password) => {
                 openModal({
                    type: 'otp',
                    title: 'Verify Email',
                    message: `Enter the OTP sent to ${email}`,
                    onConfirm: (otp) => {
                        if (otp === "123456") window.actions.finalizeSignup(email, password);
                        else showToast('Invalid OTP', 'error');
                    }
                });
            },

            finalizeLogin: async (email, password) => {
                setLoading(true);
                closeModal();
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.state.view = 'home';
                    showToast("Welcome back!");
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            },

            loginGoogle: async () => {
                try {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                    window.state.view = 'home';
                } catch (e) { showToast(e.message, 'error'); }
            },

            finalizeSignup: async (email, password) => {
                setLoading(true);
                closeModal();
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(getPublicDoc('user_roles', cred.user.uid), { role: 'customer', email });
                    showToast("Account created!");
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            },

            logout: async () => {
                await signOut(auth);
                window.state.view = 'home';
                window.state.cart = [];
                showToast("Logged out successfully");
            },

            // Seller Actions
            submitSellerRequest: async (formData) => {
                setLoading(true);
                try {
                    await addDoc(getPublicColl('seller_requests'), { ...formData, status: 'pending', createdAt: serverTimestamp() });
                    showToast("Application submitted! We will contact you.");
                    window.state.view = 'home';
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            },

            updateProduct: async (id, data) => {
                setLoading(true);
                try {
                    await updateDoc(getPublicDoc('products', id), data);
                    showToast("Product updated!");
                    window.state.view = 'seller_dashboard';
                } catch(e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            },

            // Admin Actions
            approveSeller: (reqId, email) => {
                openModal({
                    type: 'input',
                    title: 'Create Seller Account',
                    message: `Create a secure password for seller ${email}`,
                    placeholder: 'New Password',
                    onConfirm: async (password) => {
                        closeModal();
                        if(!password) return;
                        setLoading(true);
                        try {
                            const uid = await createSecondaryUser(email, password);
                            await setDoc(getPublicDoc('user_roles', uid), { role: 'seller', email });
                            await updateDoc(getPublicDoc('seller_requests', reqId), { status: 'approved', assignedUid: uid });
                            showToast(`Seller account created. Password: ${password}`);
                        } catch(e) { showToast(e.message, 'error'); } finally { setLoading(false); }
                    }
                });
            },

            // Service Actions
            resolveTicket: async (chatId) => {
                if(!confirm("Close this ticket?")) return;
                try {
                    await updateDoc(getPublicDoc('support_chats', chatId), { status: 'resolved' });
                    showToast("Ticket resolved");
                    if(window.state.activeChat?.id === chatId) window.state.activeChat = null;
                    window.state.view = 'service_dashboard';
                } catch(e) { showToast(e.message, 'error'); }
            },

            // Cart & Orders
            addToCart: (product) => {
                window.state.cart.push(product);
                showToast("Added to cart");
                renderApp();
            },
            
            placeOrder: async () => {
                if(!window.state.user || window.state.role === 'guest') return window.state.view = 'login';
                setLoading(true);
                try {
                    await addDoc(getPublicColl('orders'), {
                        customerId: window.state.user.uid,
                        customerEmail: window.state.user.email,
                        items: window.state.cart,
                        total: window.state.cart.reduce((a, b) => a + parseFloat(b.price), 0),
                        status: 'placed',
                        createdAt: serverTimestamp()
                    });
                    window.state.cart = [];
                    showToast("Order Placed Successfully!");
                    window.state.view = 'orders';
                } catch(e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            }
        };

        // --- COMPONENTS ---

        const Modal = () => {
            const { modal } = window.state;
            if (!modal) return '';
            
            return `
                <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[100] animate-fadeIn">
                    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm m-4 transform scale-100 transition-all">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fas ${modal.type==='otp' ? 'fa-shield-alt text-green-600' : 'fa-info text-blue-600'} text-2xl"></i>
                            </div>
                            <h3 class="text-xl font-bold text-slate-800">${modal.title || 'Action Required'}</h3>
                            <p class="text-slate-500 text-sm mt-2">${modal.message}</p>
                        </div>
                        
                        ${modal.type === 'otp' || modal.type === 'input' ? `
                            <input type="text" id="modalInput" placeholder="${modal.placeholder || 'Enter Code (123456)'}" class="w-full text-center text-2xl tracking-widest font-mono border-2 border-slate-200 rounded-xl py-3 mb-6 focus:border-green-500 focus:outline-none">
                        ` : ''}
                        
                        <div class="flex gap-3">
                            <button onclick="closeModal()" class="flex-1 px-4 py-2 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition">Cancel</button>
                            <button onclick="const val = document.getElementById('modalInput')?.value; window.state.modal.onConfirm(val)" class="flex-1 px-4 py-2 rounded-lg font-medium text-white bg-slate-900 hover:bg-slate-800 transition shadow-lg shadow-slate-900/20">Confirm</button>
                        </div>
                    </div>
                </div>
            `;
        };

        const Navbar = () => {
            const { user, role, cart, searchQuery } = window.state;
            return `
                <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
                    <div class="container mx-auto px-4">
                        <div class="flex flex-col md:flex-row items-center justify-between h-auto md:h-20 py-4 md:py-0 gap-4">
                            <!-- Logo -->
                            <div class="flex items-center gap-2 cursor-pointer group" onclick="window.state.view='home'; renderApp()">
                                <div class="w-10 h-10 bg-gradient-to-tr from-green-500 to-emerald-700 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-green-500/30 transition">
                                    <i class="fas fa-shield-alt text-white text-lg"></i>
                                </div>
                                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Secure<span class="text-green-600">Thing</span></h1>
                            </div>
                            
                            <!-- Search -->
                            <div class="w-full md:w-1/3 relative">
                                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input 
                                    type="text" 
                                    value="${searchQuery}"
                                    oninput="window.actions.handleSearch(this.value)"
                                    placeholder="Search products, services..." 
                                    class="w-full bg-slate-100 border-none rounded-full py-2.5 pl-11 pr-4 focus:ring-2 focus:ring-green-500/50 focus:bg-white transition"
                                >
                            </div>

                            <!-- Actions -->
                            <div class="flex items-center gap-6">
                                ${role === 'customer' || role === 'guest' ? `
                                    <div class="relative cursor-pointer group" onclick="window.state.view='cart'; renderApp()">
                                        <div class="p-2 rounded-full hover:bg-slate-100 transition relative">
                                            <i class="fas fa-shopping-bag text-xl text-slate-600 group-hover:text-green-600"></i>
                                            ${cart.length > 0 ? `<span class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">${cart.length}</span>` : ''}
                                        </div>
                                    </div>
                                ` : ''}
                                
                                ${user && !user.isAnonymous ? `
                                    <div class="flex items-center gap-4">
                                        <div class="text-right hidden sm:block">
                                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${role}</div>
                                            <div class="text-sm font-semibold text-slate-700 max-w-[120px] truncate">${user.email.split('@')[0]}</div>
                                        </div>
                                        <button onclick="window.actions.logout()" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-red-50 hover:text-red-500 transition" title="Logout">
                                            <i class="fas fa-power-off"></i>
                                        </button>
                                    </div>
                                ` : `
                                    <button onclick="window.state.view='login'; renderApp()" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-full font-medium transition shadow-lg shadow-slate-900/20">Login</button>
                                `}
                            </div>
                        </div>

                        <!-- Role Sub-menu -->
                        ${role !== 'guest' && role !== 'customer' ? `
                            <div class="flex gap-6 overflow-x-auto pb-3 md:pb-0 text-sm font-medium border-t border-slate-100 pt-3">
                                ${role === 'admin' ? `
                                    <a onclick="window.state.view='admin_dashboard'; renderApp()" class="cursor-pointer ${window.state.view.includes('admin') ? 'text-green-600' : 'text-slate-500 hover:text-slate-800'}">Overview</a>
                                    <a onclick="window.state.view='admin_users'; renderApp()" class="cursor-pointer text-slate-500 hover:text-slate-800">Users</a>
                                ` : ''}
                                ${role === 'seller' ? `
                                    <a onclick="window.state.view='seller_dashboard'; renderApp()" class="cursor-pointer ${window.state.view.includes('seller') ? 'text-green-600' : 'text-slate-500 hover:text-slate-800'}">My Products</a>
                                ` : ''}
                                ${role === 'service' ? `
                                    <a onclick="window.state.view='service_dashboard'; renderApp()" class="cursor-pointer text-green-600">Help Desk</a>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                </nav>
            `;
        };

        const Views = {
            home: () => {
                const { filteredProducts, searchQuery } = window.state;
                return `
                    <div class="animate-fadeIn">
                        <!-- Hero Section -->
                        ${!searchQuery ? `
                        <div class="bg-secondary text-white relative overflow-hidden">
                            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1557821552-17105176677c?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80')] opacity-10 bg-cover bg-center"></div>
                            <div class="container mx-auto px-4 py-20 relative z-10 text-center md:text-left">
                                <div class="max-w-2xl">
                                    <span class="inline-block px-3 py-1 bg-green-500/20 text-green-400 rounded-full text-xs font-bold uppercase mb-4 tracking-wider">Trusted by 10k+ Users</span>
                                    <h1 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">Secure Your World with <span class="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600">Certified Gear</span></h1>
                                    <p class="text-lg text-slate-300 mb-8 leading-relaxed">The only marketplace where every seller is government verified. Shop security cameras, smart locks, and safety gadgets with 100% confidence.</p>
                                    <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})" class="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-full font-bold transition shadow-lg shadow-green-500/25">Explore Collection</button>
                                </div>
                            </div>
                        </div>
                        ` : ''}

                        <!-- Products -->
                        <div id="products" class="container mx-auto py-12 px-4">
                            <div class="flex justify-between items-end mb-8">
                                <div>
                                    <h2 class="text-2xl font-bold text-slate-900">Latest Arrivals</h2>
                                    <p class="text-slate-500 mt-1">${filteredProducts.length} verified items found</p>
                                </div>
                                <!-- Simple Filter UI -->
                                <select class="bg-slate-100 border-none rounded-lg px-4 py-2 text-sm text-slate-600 focus:ring-0">
                                    <option>Sort by: Newest</option>
                                    <option>Price: Low to High</option>
                                </select>
                            </div>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                ${filteredProducts.map(p => `
                                    <div class="bg-white rounded-2xl p-4 shadow-sm hover:shadow-xl transition duration-300 group border border-slate-100 flex flex-col">
                                        <div class="relative aspect-square bg-slate-50 rounded-xl overflow-hidden mb-4">
                                            ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><i class="fas fa-cube text-4xl"></i></div>`}
                                            
                                            <!-- Hover Action -->
                                            <button onclick='window.actions.addToCart(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="absolute bottom-3 right-3 bg-slate-900 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg transform translate-y-10 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition duration-300">
                                                <i class="fas fa-plus"></i>
                                            </button>
                                        </div>
                                        <div>
                                            <div class="flex justify-between items-start mb-2">
                                                <h3 class="font-bold text-slate-800 line-clamp-1 text-lg">${p.name}</h3>
                                                <span class="text-green-600 font-bold bg-green-50 px-2 py-1 rounded-md text-sm">$${p.price}</span>
                                            </div>
                                            <p class="text-sm text-slate-500 mb-4 line-clamp-2 min-h-[40px]">${p.description}</p>
                                            <div class="flex items-center gap-2 border-t pt-3 mt-auto">
                                                <div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-[10px] text-slate-500 font-bold">
                                                    ${p.sellerEmail?.[0].toUpperCase()}
                                                </div>
                                                <span class="text-xs text-slate-400 truncate">Verified Seller</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            
                            ${filteredProducts.length === 0 ? `
                                <div class="text-center py-20 bg-slate-50 rounded-3xl border border-dashed border-slate-300">
                                    <i class="fas fa-search text-4xl text-slate-300 mb-4"></i>
                                    <p class="text-slate-500 font-medium">No secure items match your search.</p>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            },
            admin_dashboard: () => {
                const { orders, sellerRequests, serviceMembers, products } = window.state;
                const totalRevenue = orders.reduce((sum, o) => sum + (o.total || 0), 0).toFixed(2);
                
                return `
                    <div class="container mx-auto py-8 px-4 animate-fadeIn">
                        <h2 class="text-3xl font-bold mb-8">Admin Overview</h2>
                        
                        <!-- Stats Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <div class="text-slate-400 text-xs font-bold uppercase mb-2">Total Revenue</div>
                                <div class="text-3xl font-bold text-slate-900">$${totalRevenue}</div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <div class="text-slate-400 text-xs font-bold uppercase mb-2">Total Orders</div>
                                <div class="text-3xl font-bold text-slate-900">${orders.length}</div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <div class="text-slate-400 text-xs font-bold uppercase mb-2">Active Products</div>
                                <div class="text-3xl font-bold text-slate-900">${products.length}</div>
                            </div>
                             <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <div class="text-slate-400 text-xs font-bold uppercase mb-2">Support Staff</div>
                                <div class="text-3xl font-bold text-slate-900">${serviceMembers?.length || 0}</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <!-- Left Col: Seller Approvals -->

                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-lg text-slate-900">Total: $${o.total}</span>
                                        <button onclick="window.actions.startChat()" class="text-sm font-bold text-slate-500 hover:text-slate-900 flex items-center gap-2"><i class="far fa-comment-alt"></i> Need Help?</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                 `;
            } else if (view === 'service_dashboard') {
                const { chats } = window.state;
                content += `
                     <div class="container mx-auto py-8 px-4 animate-fadeIn">
                        <h2 class="text-2xl font-bold mb-6">Support Queue</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${chats.filter(c => c.status !== 'resolved').map(c => `
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-l-4 border-l-green-500 cursor-pointer hover:shadow-md transition" onclick="window.state.activeChat=window.state.chats.find(chat=>chat.id==='${c.id}'); window.state.view='chat'; renderApp()">
                                    <div class="flex justify-between mb-3">
                                        <span class="font-bold text-sm text-slate-800">${c.customerEmail}</span>
                                        <span class="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500 font-bold uppercase">Active</span>
                                    </div>
                                    <p class="text-sm text-slate-500 truncate mb-2">${c.messages?.[c.messages.length-1]?.text || 'No messages'}</p>
                                    <div class="text-xs text-slate-400 text-right">Click to reply</div>
                                </div>
                            `).join('')}
                             ${chats.filter(c => c.status !== 'resolved').length === 0 ? '<div class="col-span-3 text-center py-10 text-slate-400 bg-slate-50 rounded-xl">All caught up! No active tickets.</div>' : ''}
                        </div>
                     </div>
                `;
            }

            content += `
                <div id="global-loader" class="fixed inset-0 bg-white/90 backdrop-blur-md z-[200] hidden items-center justify-center flex-col">
                    <div class="w-16 h-16 border-4 border-slate-200 border-t-green-500 rounded-full animate-spin mb-4"></div>
                    <p class="text-slate-900 font-bold tracking-widest animate-pulse">SECURING...</p>
                </div>
            `;
            
            // Re-attach seller add function because view changed
            window.actions.addProduct = async (productData) => {
                setLoading(true);
                try {
                    await addDoc(getPublicColl('products'), {
                        ...productData,
                        sellerId: window.state.user.uid,
                        sellerEmail: window.state.user.email,
                        createdAt: serverTimestamp()
                    });
                    showToast("Product added!");
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            };
            
            // Re-attach delete
            window.actions.deleteProduct = async (id) => {
                setLoading(true);
                try {
                    await deleteDoc(getPublicDoc('products', id));
                    showToast("Product deleted");
                    renderApp();
                } catch (e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            };
            
             // Re-attach chat start
            window.actions.startChat = async () => {
                setLoading(true);
                try {
                    const existingChat = window.state.chats.find(c => c.customerId === window.state.user.uid && c.status === 'open');
                    if(existingChat) {
                        window.state.activeChat = existingChat;
                    } else {
                        const ref = await addDoc(getPublicColl('support_chats'), {
                            customerId: window.state.user.uid,
                            customerEmail: window.state.user.email,
                            messages: [],
                            status: 'open',
                            createdAt: serverTimestamp()
                        });
                        window.state.activeChat = { id: ref.id, messages: [] };
                    }
                    window.state.view = 'chat';
                    renderApp();
                } catch(e) { showToast(e.message, 'error'); } finally { setLoading(false); }
            };
            
            window.actions.sendMessage = async (chatId, text, sender) => {
                try {
                    const chatRef = getPublicDoc('support_chats', chatId);
                    const chatDoc = await getDoc(chatRef);
                    if(!chatDoc.exists()) return;
                    const messages = chatDoc.data().messages || [];
                    messages.push({ text, sender, time: new Date().toISOString() });
                    await updateDoc(chatRef, { messages });
                    // Optimistic update for UI snap
                    if(window.state.activeChat && window.state.activeChat.id === chatId) {
                         window.state.activeChat.messages = messages;
                         renderApp();
                    }
                } catch(e) { console.error(e); }
            };

            appDiv.innerHTML = content;
            if(view === 'chat') {
                const box = document.getElementById('chat-box');
                if(box) box.scrollTop = box.scrollHeight;
            }
        };

        // --- HANDLER WRAPPERS ---
        window.handleSellerRequest = (e) => {
            e.preventDefault();
            const form = e.target;
            const file = form.querySelector('input[type="file"]').files[0];
            const submit = (photo) => {
                 window.actions.submitSellerRequest({
                    name: form.name.value,
                    mobile: form.mobile.value,
                    email: form.email.value,
                    company: form.company.value,
                    address: form.address.value || 'Not specified',
                    dob: form.dob.value,
                    docType: form.docType.value,
                    photo
                });
            };

            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => submit(reader.result);
                reader.readAsDataURL(file);
            } else {
                submit(null);
            }
        };

        // --- START ---
        // Create Role Collection if missing (Init logic only run once per session conceptually)
        renderApp();
    </script>
</head>
<body class="bg-white text-slate-800 font-sans min-h-screen">
    <div id="app" class="min-h-screen flex flex-col"></div>
</body>
</html>
